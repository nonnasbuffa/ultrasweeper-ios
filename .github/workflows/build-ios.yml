# Builds an unsigned UltraSweeper.ipa on a GitHub-hosted Mac.
# Sign/install it afterwards with your own tool (Sideloadly, ESign, AltStore, ...).
# Every push to main keeps the IPA as a downloadable artifact; pushing a version tag
# (for example v1.0.4) also publishes it as a Release.
name: Build UltraSweeper IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the iOS project
        run: npx cap sync ios

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package UltraSweeper.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry UltraSweeper.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSweeper-ipa
          path: UltraSweeper.ipa

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" UltraSweeper.ipa \
            --title "UltraSweeper ${GITHUB_REF_NAME#v} for iPhone" \
            --notes "Download **UltraSweeper.ipa** below. It's unsigned: sign and install it with your own tool (Sideloadly, ESign, AltStore...)."
