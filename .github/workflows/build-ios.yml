# Builds unsigned UltraSweeper.ipa and UltraSweeper-Lite.ipa on a GitHub-hosted Intel Mac (they usually have shorter queues than the Apple silicon ones).
# Sign/install them afterwards with your own tool (Sideloadly, ESign, AltStore, ...).
# Every push to main keeps the IPAs as downloadable artifacts; pushing a version tag
# (for example v1.0.4) also publishes them as a Release.
name: Build UltraSweeper IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the iOS project
        run: npx cap sync ios

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package UltraSweeper.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry UltraSweeper.ipa Payload

      # UltraSweeper Lite: the same app with Lite's index.html, and its own bundle id and name so both can be installed.
      - name: Build UltraSweeper Lite (unsigned)
        run: |
          cp www-lite/index.html www/index.html
          cp ios-lite/AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/
          cp ios-lite/splash-*.png ios/App/App/Assets.xcassets/Splash.imageset/
          npx cap copy ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-lite \
            PRODUCT_BUNDLE_IDENTIFIER=com.offlineminesweeper.app.lite \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName UltraSweeper Lite" build-lite/Build/Products/Release-iphoneos/App.app/Info.plist

      - name: Package UltraSweeper-Lite.ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build-lite/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry UltraSweeper-Lite.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSweeper-ipa
          path: |
            UltraSweeper.ipa
            UltraSweeper-Lite.ipa

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" UltraSweeper.ipa UltraSweeper-Lite.ipa \
            --title "UltraSweeper ${GITHUB_REF_NAME#v} for iPhone" \
            --notes "Download **UltraSweeper.ipa**, or **UltraSweeper-Lite.ipa** for the classic-look version made for older iPhones. They're unsigned: sign and install them with your own tool (Sideloadly, ESign, AltStore...)."
